# The `time` MCP server, exposed over HTTP for LocalAGI.
#
#   kubectl apply -f mcp-time-k8s.yaml
#
# WHY A BRIDGE IS NEEDED
#
# mcp-server-time speaks stdio only. LocalAGI can run stdio servers, but as CHILD
# PROCESSES of its own container — and the LocalAGI image (v2.8.1) contains no
# node, npx, python3 or uv:
#
#   node MISSING   npx MISSING   python3 MISSING   uvx MISSING
#   bash /usr/bin/bash   curl /usr/bin/curl   docker /usr/bin/docker   git /usr/bin/git
#
# So the entire `npx @modelcontextprotocol/server-*` and `uvx mcp-server-*`
# ecosystem cannot run as a stdio child without first installing a runtime (see
# mcp_prepare_script in the README).
#
# mcp-proxy wraps the stdio server and serves it over SSE, which LocalAGI reaches
# over the network. That is also the better architecture: its own lifecycle, its
# own restart, and something a NetworkPolicy can constrain.
#
# NOTE: packages are installed at pod start, so startup needs network access.
# Bake an image for anything long-lived. Versions pinned to what we validated.
#
# Validated 2026-08-17 on k0s v1.34.3. mcp-proxy 0.12.0, mcp-server-time 2026.8.18.
apiVersion: v1
kind: Service
metadata:
  name: mcp-time
  namespace: localai-stack
spec:
  selector:
    app: mcp-time
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-time
  namespace: localai-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-time
  template:
    metadata:
      labels:
        app: mcp-time
    spec:
      containers:
        - name: mcp-time
          image: python:3.13-slim
          command: ["sh", "-c"]
          args:
            - |
              pip install --no-cache-dir --quiet mcp-proxy==0.12.0 mcp-server-time==2026.8.18 && \
              pip list 2>/dev/null | grep -iE 'mcp-proxy|mcp-server-time' && \
              exec mcp-proxy --host=0.0.0.0 --port=8080 -- mcp-server-time --local-timezone=UTC
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { memory: "512Mi" }
