site_name: LocalAI Stack Handbook
site_description: >-
  An independent field manual for LocalAI, LocalAGI and LocalRecall —
  architecture, integration, deployment and troubleshooting.
site_url: https://wrkode.github.io/local-ai-stack-handbook/
repo_url: https://github.com/wrkode/local-ai-stack-handbook
repo_name: wrkode/local-ai-stack-handbook
edit_uri: edit/main/docs/
copyright: >-
  Apache 2.0. Not affiliated with the LocalAI, LocalAGI or LocalRecall projects.

docs_dir: docs

# The handbook is plain Markdown first. MkDocs adds navigation, search and
# rendered Mermaid; nothing here is required to read the repository on GitHub.
theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.highlight
    - search.suggest
  palette:
    # Deliberately plain. This should read like an engineering manual, not a
    # product site.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono

extra_css:
  - assets/handbook.css

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # Deep enough for reference pages, shallow enough that the sidebar stays
      # usable on long architecture pages.
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.smartsymbols
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  # Renders ```mermaid fences client-side. GitHub renders the same fences
  # natively, so diagrams work in both places without duplication.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/wrkode/local-ai-stack-handbook
      name: Handbook repository
    - icon: fontawesome/brands/github
      link: https://github.com/mudler/LocalAI
      name: LocalAI upstream
  generator: false

# Fail the build on ambiguous or unresolvable internal links rather than
# emitting a broken site. CI runs `mkdocs build --strict`.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# Explicit nav rather than inferred: the reading order matters here, and the
