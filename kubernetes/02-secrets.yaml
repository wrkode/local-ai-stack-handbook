# TEMPLATE — replace every value before applying.
#
# The five keys must agree, or internal hops 401 while the external surface
# looks healthy:
#
#   LOCALAI_API_KEY == LOCALAGI_LLM_API_KEY == LOCALRECALL_OPENAI_API_KEY
#
# Note: when LOCALAGI_LLM_API_KEY is unset the client sends the literal string
# "sk-xxx" — so a missing key looks like a WRONG key in the log.
apiVersion: v1
kind: Secret
metadata:
  name: localai-stack-secrets
  namespace: localai-stack
type: Opaque
stringData:
  LOCALAI_API_KEY: "REPLACE-ME"
  LOCALAGI_LLM_API_KEY: "REPLACE-ME"
  LOCALRECALL_OPENAI_API_KEY: "REPLACE-ME"

  # Inbound keys, comma-separated. NOTE: LocalAGI's auth middleware is GLOBAL,
  # so setting this makes /api/agents require a key — including the readiness
  # probe in 06-localagi.yaml, which must then carry the header.
  LOCALAGI_API_KEYS: "REPLACE-ME"
  LOCALRECALL_API_KEYS: "REPLACE-ME"

  POSTGRES_PASSWORD: "REPLACE-ME"
  # sslmode=disable is acceptable only while PostgreSQL is in-cluster on a
  # trusted network.
  DATABASE_URL: "postgresql://localrecall:REPLACE-ME@postgres:5432/localrecall?sslmode=disable"
