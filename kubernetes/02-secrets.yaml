# Authentication is DISABLED by default (empty keys), because that is the only
# configuration whose probes work out of the box. Read this whole comment before
# turning it on — it is not a one-line change.
#
# When you do enable it, the five keys must agree, or internal hops 401 while the
# external surface looks healthy:
#
#   LOCALAI_API_KEY == LOCALAGI_LLM_API_KEY == LOCALRECALL_OPENAI_API_KEY
#
# Note that when LOCALAGI_LLM_API_KEY is unset the client sends the literal
# string "sk-xxx" — so a MISSING key looks like a WRONG key in the log.
#
# ---------------------------------------------------------------------------
# ENABLING AUTH BREAKS EVERY PROBE
#
# Verified on a live cluster: with keys set and probes unchanged, LocalAI sat
# 0/1 forever and LocalRecall was killed by its liveness probe in a restart
# loop. Both logged a stream of 401s from user_agent "kube-probe/1.34".
#
# There is no clean fix, because a Kubernetes httpGet probe CANNOT read a
# Secret — httpHeaders values are static strings. Per service:
#
#   LocalAI      exec probe with
#                  curl -H "Authorization: Bearer $LOCALAI_API_KEY"
#                The env var is already in the container. This works, and is
#                what 04-localai.yaml does.
#
#   LocalAGI     httpGet with a HARDCODED token in httpHeaders, or an exec
#                probe — that image has curl. See 06-localagi.yaml.
#
#   LocalRecall  NEITHER works. The image is FROM scratch: no shell and no
#                curl, so exec probes are impossible; and httpGet cannot read
#                the Secret. Your options are to hardcode the token in
#                httpHeaders, drop its probes, or leave API_KEYS empty and
#                restrict access with a NetworkPolicy instead.
#
# Leaving inbound auth off and relying on network policy is what this file
# does. That is a defensible choice for an internal cluster and an indefensible
# one for anything reachable from outside — see
# docs/06-deployment/security.md.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: localai-stack-secrets
  namespace: localai-stack
type: Opaque
stringData:
  # Outbound keys, sent BY a service. Empty = no auth expected upstream.
  LOCALAI_API_KEY: ""
  LOCALAGI_LLM_API_KEY: ""
  LOCALRECALL_OPENAI_API_KEY: ""

  # Inbound keys, comma-separated, required OF callers. NOTE: LocalAGI's auth
  # middleware is GLOBAL, so setting this makes even /api/agents require a key.
  LOCALAGI_API_KEYS: ""
  LOCALRECALL_API_KEYS: ""

  # ---------------------------------------------------------------------------
  # GENERATE THIS. Do not deploy the placeholder.
  #
  # A password committed to a git repository is not a secret, whatever its value,
  # so this file ships one that cannot work by accident. Generate a real one and
  # keep it out of version control:
  #
  #   PW=$(openssl rand -base64 24 | tr -d '/+=' | head -c 32)
  #   kubectl -n localai-stack create secret generic localai-stack-secrets \
  #     --from-literal=POSTGRES_PASSWORD="$PW" \
  #     --from-literal=DATABASE_URL="postgresql://localrecall:$PW@postgres:5432/localrecall?sslmode=disable" \
  #     --from-literal=LOCALAI_API_KEY= \
  #     --from-literal=LOCALAGI_LLM_API_KEY= \
  #     --from-literal=LOCALRECALL_OPENAI_API_KEY= \
  #     --from-literal=LOCALAGI_API_KEYS= \
  #     --from-literal=LOCALRECALL_API_KEYS= \
  #     --dry-run=client -o yaml | kubectl apply -f -
  #
  # That replaces this whole Secret, so skip 02-secrets.yaml when you use it.
  #
  # The password must match in BOTH keys below — PostgreSQL reads
  # POSTGRES_PASSWORD on first init, and LocalRecall connects with DATABASE_URL.
  # A mismatch surfaces as an authentication failure from LocalRecall only, while
  # PostgreSQL itself looks perfectly healthy.
  #
  # Changing it after first init does NOT change the database: POSTGRES_PASSWORD
  # is applied by initdb and ignored thereafter. Either ALTER USER inside the
  # running database, or delete the PVC and start over.
  # ---------------------------------------------------------------------------
  POSTGRES_PASSWORD: "REPLACE-ME-GENERATE-A-PASSWORD"

  # sslmode=disable is acceptable only while PostgreSQL is in-cluster on a
  # trusted network. The password here must equal POSTGRES_PASSWORD above.
  DATABASE_URL: "postgresql://localrecall:REPLACE-ME-GENERATE-A-PASSWORD@postgres:5432/localrecall?sslmode=disable"
