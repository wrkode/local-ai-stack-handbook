# Pods that need a GPU set runtimeClassName: nvidia, which maps to the
# containerd runtime registered by containerd-nvidia.toml.
#
# Registering nvidia as an additional runtime (rather than making it the node
# default) means non-GPU pods are untouched — but it also means EVERY GPU pod
# must set runtimeClassName, including the device plugin itself.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: nvidia
